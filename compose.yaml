name: zoclip
x-app: &app
  build: .
  environment: &environment
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    EMAIL_MODE: ${EMAIL_MODE:-disabled}
    DEV_MAILBOX_DIR: /app/var/mailbox
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
    AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-900}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
    ANONYMOUS_TTL_SECONDS: ${ANONYMOUS_TTL_SECONDS:-1800}
    ENABLE_LIVE_PAYMENTS: ${ENABLE_LIVE_PAYMENTS:-false}
    ENABLE_TRIAL_CREDITS: ${ENABLE_TRIAL_CREDITS:-false}
    PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
    MEDIA_ROOT: /app/var/media
    MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-4294967296}
    MEDIA_PART_BYTES: ${MEDIA_PART_BYTES:-8388608}
    MEDIA_HEADROOM_BYTES: ${MEDIA_HEADROOM_BYTES:-21474836480}
    MEDIA_RETAINED_BYTES: ${MEDIA_RETAINED_BYTES:-42949672960}
    MEDIA_ALLOWED_IMPORT_HOSTS: ${MEDIA_ALLOWED_IMPORT_HOSTS:-[]}
    MEDIA_INGESTION_LIMIT: ${MEDIA_INGESTION_LIMIT:-2}
    MEDIA_USER_INGESTION_LIMIT: ${MEDIA_USER_INGESTION_LIMIT:-1}
    MEDIA_PENDING_LIMIT: ${MEDIA_PENDING_LIMIT:-10}
    MEDIA_USER_PROCESSING_LIMIT: ${MEDIA_USER_PROCESSING_LIMIT:-1}
    MEDIA_UPLOAD_TTL_SECONDS: ${MEDIA_UPLOAD_TTL_SECONDS:-86400}
    MEDIA_RETENTION_SECONDS: ${MEDIA_RETENTION_SECONDS:-604800}
    FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
    FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
    AI_ENABLED: ${AI_ENABLED:-false}
    DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
    DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-}
    DEEPGRAM_VERSION: ${DEEPGRAM_VERSION:-}
    DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-en}
    AI_APPROVED_LANGUAGES: ${AI_APPROVED_LANGUAGES:-["en"]}
    DEEPGRAM_DIARIZE: ${DEEPGRAM_DIARIZE:-false}
    DEEPGRAM_UTTERANCES: ${DEEPGRAM_UTTERANCES:-false}
    DEEPGRAM_MIP_OPT_OUT: ${DEEPGRAM_MIP_OPT_OUT:-true}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-}
    AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-120}
    AI_CALLS_PER_MINUTE: ${AI_CALLS_PER_MINUTE:-6}
    AI_CHUNK_BYTES: ${AI_CHUNK_BYTES:-16000}
    AI_MAX_CHUNKS: ${AI_MAX_CHUNKS:-32}
    AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
    AI_MAX_CANDIDATES: ${AI_MAX_CANDIDATES:-10}
    AI_MIN_CLIP_SECONDS: ${AI_MIN_CLIP_SECONDS:-15}
    AI_MAX_CLIP_SECONDS: ${AI_MAX_CLIP_SECONDS:-90}
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: zoclip
      POSTGRES_DB: zoclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zoclip -d zoclip"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    mem_limit: 512m
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    volumes: [mailbox:/app/var/mailbox, media:/app/var/media]
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; from urllib.parse import urlsplit; req=urllib.request.Request('http://localhost:8000/health/ready',headers={'Host':urlsplit(os.environ['API_PUBLIC_URL']).netloc}); urllib.request.urlopen(req, timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
  worker-ai:
    <<: *app
    volumes: [media:/app/var/media]
    environment:
      <<: *environment
      WORKER_QUEUE: ai
    command: [python, -m, zoclip.workers.run]
    mem_limit: 1024m
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker-render:
    <<: *app
    volumes: [media:/app/var/media]
    environment:
      <<: *environment
      WORKER_QUEUE: render
    command: [python, -m, zoclip.workers.run]
    mem_limit: 2048m
    cpus: 2.0
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  maintenance:
    <<: *app
    volumes: [media:/app/var/media]
    command: [python, -m, zoclip.workers.maintenance]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  mailbox:
  media:
