# SSH/VPN transport ONLY. Admin routes share the browser API origin and retain RBAC/CSRF.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    log_format safe '{"status":$status,"seconds":$request_time}';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=api_rate:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=api_connections:1m;
    limit_req_status 429;
    client_max_body_size 16k;
    client_body_timeout 65s;
    keepalive_timeout 15s;
    send_timeout 65s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_key;
    server {
        listen 8443 ssl default_server;
        include /etc/nginx/zoclip-server.conf;
        location ~* ^/(docs(?:/|$)|openapi\.json|redoc(?:/|$)|api/v1/billing/webhooks(?:/|$)|api/v1/auth/(?:register|google)(?:/|$)) { return 404; }
        location ~ "^/api/v1/uploads/[a-fA-F0-9-]{36}/parts/[0-9]+$" {
            client_max_body_size 8m;
            include /etc/nginx/zoclip-proxy.conf;
        }
        location / { include /etc/nginx/zoclip-proxy.conf; }
    }
    server {
        listen 8444 ssl;
        include /etc/nginx/zoclip-server.conf;
        location /api/v1/admin/ { include /etc/nginx/zoclip-proxy.conf; }
        location / { return 404; }
    }
}
