[Service]
ExecStart=
ExecStart=/usr/bin/python3 deploy/manage.py resume --env-file /etc/zoclip/staging.env --project zoclip-private --private-staging --execute-local
ExecStop=
ExecStop=/usr/bin/python3 deploy/manage.py stop --env-file /etc/zoclip/staging.env --project zoclip-private --private-staging --execute-local
