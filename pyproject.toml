[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zoclip-backend"
version = "0.1.0"
description = "ZoClip Phase 1 backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "redis>=5.2,<7",
  "rq>=2.1,<3",
  "argon2-cffi>=23.1,<26",
  "authlib>=1.8,<2",
  "joserfc>=1.7,<2",
  "httpx>=0.28,<1",
  "cryptography>=50.0.2,<51",
  "opencv-python-headless==4.12.0.88",
  "faster-whisper==1.2.1",
  # faster-whisper 1.2.1 still passes metadata_errors, removed by newer PyAV.
  "av==17.1.0",
  "yt-dlp==2026.10.26",
  "bgutil-ytdlp-pot-provider==2.0.2",
  "yt-dlp-ejs==0.8.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-redis>=4.6,<5", "openapi-spec-validator>=0.7,<1", "fakeredis[lua]>=2.28,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/zoclip"]
